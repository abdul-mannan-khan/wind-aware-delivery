# Same grid as baseline_small, but the wind-aware planner allows only 30 deg of steady tilt (default 35 deg).
# Expect more refusals and fewer in-flight failures. Only the 'wind' planner uses this limit.
name: tilt_limit_30
description: Stricter steady-tilt limit for the wind-aware planner.
grid:
  U_ref: [4, 8, 12, 16]
  theta: [0, 90, 180, 270]
  customer: [0]
  planner: [wind]
  controller: [dob]
  seed: [0]
planner:
  TILT_LIMIT: 30
